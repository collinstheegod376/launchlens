<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Solana Neon Gradient -->
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#14f195" />
      <stop offset="100%" stop-color="#9945ff" />
    </linearGradient>

    <!-- Glow Effect Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base Badge (ideal for Telegram avatar) -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  
  <!-- Outer Scanner Track -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.3" />

  <!-- Radar Scope Crosshair Axis -->
  <line x1="256" y1="48" x2="256" y2="96" stroke="#00f0ff" stroke-width="2" opacity="0.7" />
  <line x1="256" y1="416" x2="256" y2="464" stroke="#00f0ff" stroke-width="2" opacity="0.7" />
  <line x1="48" y1="256" x2="96" y2="256" stroke="#00f0ff" stroke-width="2" opacity="0.7" />
  <line x1="416" y1="256" x2="464" y2="256" stroke="#00f0ff" stroke-width="2" opacity="0.7" />

  <!-- Hexagonal Aperture Iris Blades -->
  <g filter="url(#neonGlow)" stroke="url(#solanaGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Aperture Blade 1 -->
    <path d="M 256 100 L 391 178 L 340 256" opacity="0.85" />
    <!-- Aperture Blade 2 -->
    <path d="M 391 178 L 391 334 L 290 334" opacity="0.85" />
    <!-- Aperture Blade 3 -->
    <path d="M 391 334 L 256 412 L 205 334" opacity="0.85" />
    <!-- Aperture Blade 4 -->
    <path d="M 256 412 L 121 334 L 172 256" opacity="0.85" />
    <!-- Aperture Blade 5 -->
    <path d="M 121 334 L 121 178 L 222 178" opacity="0.85" />
    <!-- Aperture Blade 6 -->
    <path d="M 121 178 L 256 100 L 307 178" opacity="0.85" />
  </g>

  <!-- Inner Focal Rings -->
  <circle cx="256" cy="256" r="100" fill="#080c14" fill-opacity="0.8" stroke="#00f0ff" stroke-width="2" opacity="0.8" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#14f195" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.9" />

  <!-- Central Launch Prism & Target Crosshair -->
  <g filter="url(#coreGlow)">
    <!-- Central Optical Diamond / Token Core -->
    <polygon points="256,196 306,256 256,316 206,256" fill="url(#solanaGrad)" fill-opacity="0.25" stroke="url(#solanaGrad)" stroke-width="3.5" />
    
    <!-- Stylized Ascension Arrow / Rocket Spike inside diamond -->
    <path d="M 256 216 L 286 266 L 256 254 L 226 266 Z" fill="#00f0ff" />
    
    <!-- Focal Point Particle -->
    <circle cx="256" cy="256" r="5" fill="#ffffff" />
  </g>

  <!-- Fine Calibration Ticks (45 degree diagonals) -->
  <circle cx="140" cy="140" r="3" fill="#00f0ff" opacity="0.8" />
  <circle cx="372" cy="140" r="3" fill="#14f195" opacity="0.8" />
  <circle cx="372" cy="372" r="3" fill="#9945ff" opacity="0.8" />
  <circle cx="140" cy="372" r="3" fill="#00f0ff" opacity="0.8" />
</svg>
